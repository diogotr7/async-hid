[package]
name = "async-hid-wasm-demo"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-hid = { path = "../../", default-features = false }
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Window"] }
console_log = "1"
console_error_panic_hook = "0.1"
futures-lite = "2.5"
